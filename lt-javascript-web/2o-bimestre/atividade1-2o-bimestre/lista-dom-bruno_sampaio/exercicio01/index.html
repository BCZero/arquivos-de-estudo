<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01 • Mensagem de boas-vindas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main>
    <a class="voltar" href="../index.html">← Todos os exercícios</a>
    <header><span class="etiqueta">JavaScript e DOM / Exercício 01</span><h1>Mensagem de boas-vindas</h1><p>Uma recepção personalizada para cada visitante.</p></header>
    <form novalidate>
        <div class="campos"><label for="nome">Nome do visitante<input id="nome" name="nome" type="text" autocomplete="off" required></label></div>
        <button id="acao" type="submit">Apresentar mensagem</button>
        
    </form>
    <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
    
    <footer>Bruno Sampaio · Lista de exercícios de manipulação do DOM</footer>
</main>
</body>
</html>
