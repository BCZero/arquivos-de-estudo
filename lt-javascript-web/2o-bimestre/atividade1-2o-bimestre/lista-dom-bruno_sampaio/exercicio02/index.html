<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02 • Calculadora de compra</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main>
    <a class="voltar" href="../index.html">← Todos os exercícios</a>
    <header><span class="etiqueta">JavaScript e DOM / Exercício 02</span><h1>Calculadora de compra</h1><p>Informe os dados do produto e confira o total da compra.</p></header>
    <form novalidate>
        <div class="campos"><label for="nome">Nome do produto<input id="nome" name="nome" type="text" autocomplete="off" required></label><label for="preco">Preço unitário (R$)<input id="preco" name="preco" type="number" min="0.01" step="0.01" required></label><label for="quantidade">Quantidade<input id="quantidade" name="quantidade" type="number" min="1" step="1" required></label></div>
        <button id="acao" type="submit">Calcular compra</button>
        
    </form>
    <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
    <section id="resultado" class="painel" aria-live="polite" hidden><h2>Resumo da compra</h2><ul id="detalhes"></ul></section>
    <footer>Bruno Sampaio · Lista de exercícios de manipulação do DOM</footer>
</main>
</body>
</html>
