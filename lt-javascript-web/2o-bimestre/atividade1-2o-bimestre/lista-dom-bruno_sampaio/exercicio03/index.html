<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03 • Situação do estudante</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main>
    <a class="voltar" href="../index.html">← Todos os exercícios</a>
    <header><span class="etiqueta">JavaScript e DOM / Exercício 03</span><h1>Situação do estudante</h1><p>Calcule a média de duas notas e consulte a situação do estudante.</p></header>
    <form novalidate>
        <div class="campos"><label for="nome">Nome do estudante<input id="nome" name="nome" type="text" autocomplete="off" required></label><label for="nota1">Primeira nota<input id="nota1" name="nota1" type="number" min="0" max="10" step="any" required></label><label for="nota2">Segunda nota<input id="nota2" name="nota2" type="number" min="0" max="10" step="any" required></label></div>
        <button id="acao" type="submit">Verificar situação</button>
        
    </form>
    <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
    
    <footer>Bruno Sampaio · Lista de exercícios de manipulação do DOM</footer>
</main>
</body>
</html>
